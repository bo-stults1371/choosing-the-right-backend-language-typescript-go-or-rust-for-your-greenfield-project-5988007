name: ai-companion

services:
  llama:
    build:
      context: ./llama
      args:
        LLAMA_CPP_REF: ${LLAMA_CPP_REF:-master}
        CUDA_VERSION: ${CUDA_VERSION:-12.4.1}
    image: ai-companion/llama-server:local
    restart: unless-stopped
    # tini as PID 1 so SIGTERM stops the container during the model download.
    init: true
    environment:
      HF_REPO: ${HF_REPO:-huihui-ai/Huihui-Qwen3.6-35B-A3B-abliterated-MTP-GGUF}
      MODEL_FILE: ${MODEL_FILE:-Huihui-Qwen3.6-35B-A3B-abliterated-ggml-model-Q4_K.gguf}
      HF_TOKEN: ${HF_TOKEN:-}
      LLAMA_CTX: ${LLAMA_CTX:-262144}
      LLAMA_NGL: ${LLAMA_NGL:-99}
      LLAMA_SPEC_DRAFT_N_MAX: ${LLAMA_SPEC_DRAFT_N_MAX:-6}
      LLAMA_EXTRA_ARGS: ${LLAMA_EXTRA_ARGS:-}
      LLAMA_API_KEY: ${LLAMA_API_KEY:-}
    volumes:
      - ${DATA_ROOT:-/workspace/companion}/models:/models
    # Loopback only: reachable from the host for debugging and from SillyTavern
    # over the compose network as http://llama:8080, never from the internet.
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      # First start downloads the model (21.7 GB) and loads it into VRAM.
      start_period: 60m

  sillytavern:
    image: ghcr.io/sillytavern/sillytavern:latest
    restart: unless-stopped
    depends_on:
      llama:
        condition: service_started
    environment:
      NODE_ENV: production
      FORCE_COLOR: "1"
      ST_BASIC_AUTH_USER: ${ST_BASIC_AUTH_USER:?set ST_BASIC_AUTH_USER in .env}
      ST_BASIC_AUTH_PASSWORD: ${ST_BASIC_AUTH_PASSWORD:?set ST_BASIC_AUTH_PASSWORD in .env}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      # Seeded into SillyTavern secrets as api_key_llamacpp when set.
      LLAMA_API_KEY: ${LLAMA_API_KEY:-}
      # SILLYTAVERN_<KEY> overrides config.yaml, so auth cannot be switched off
      # by an edited or stale config on the persistent volume.
      SILLYTAVERN_LISTEN: "true"
      SILLYTAVERN_WHITELISTMODE: "false"
      SILLYTAVERN_BASICAUTHMODE: "true"
      SILLYTAVERN_BASICAUTHUSER_USERNAME: ${ST_BASIC_AUTH_USER:?set ST_BASIC_AUTH_USER in .env}
      SILLYTAVERN_BASICAUTHUSER_PASSWORD: ${ST_BASIC_AUTH_PASSWORD:?set ST_BASIC_AUTH_PASSWORD in .env}
      SILLYTAVERN_BROWSERLAUNCH_ENABLED: "false"
      SILLYTAVERN_HEARTBEATINTERVAL: "30"
    volumes:
      - ${DATA_ROOT:-/workspace/companion}/sillytavern/config:/home/node/app/config
      - ${DATA_ROOT:-/workspace/companion}/sillytavern/data:/home/node/app/data
      - ${DATA_ROOT:-/workspace/companion}/sillytavern/plugins:/home/node/app/plugins
      - ${DATA_ROOT:-/workspace/companion}/sillytavern/extensions:/home/node/app/public/scripts/extensions/third-party
      - ./sillytavern/config.yaml:/opt/companion/config.yaml:ro
      - ./sillytavern/init.sh:/opt/companion/init.sh:ro
    ports:
      - "${ST_BIND:-0.0.0.0}:${ST_PORT:-8000}:8000"
    # The image's entrypoint is `tini -- ./docker-entrypoint.sh` (workdir /home/node/app).
    # Run init.sh first (installs config.yaml, seeds secrets), then hand over to it.
    entrypoint: ["tini", "--", "/bin/sh", "-ec"]
    command:
      - |
        case "$${ST_BASIC_AUTH_PASSWORD:-}" in
          ""|password|Password|changeme|change-me|change_me|admin|sillytavern|123456|secret)
            echo "FATAL: ST_BASIC_AUTH_PASSWORD is empty or a known default; refusing to start." >&2
            exit 1 ;;
        esac
        sh /opt/companion/init.sh
        exec ./docker-entrypoint.sh
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
